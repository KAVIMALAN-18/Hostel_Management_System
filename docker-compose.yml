version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./hostel-management-backend
    restart: unless-stopped
    env_file:
      - ./hostel-management-backend/.env
    ports:
      - "5001:5001"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./hostel-management-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
